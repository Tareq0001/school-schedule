<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyA_WVB2hbJABjRdIAVLc-1b4BDqFjnI-zE", // مفتاحك
        authDomain: "mawaheb-schedule.firebaseapp.com",
        projectId: "mawaheb-schedule",
        storageBucket: "mawaheb-schedule.firebasestorage.app", // تأكد من اسم الـ storageBucket
        messagingSenderId: "831401201099",
        appId: "1:831401201099:web:a8518443249b1bcf2aba4e"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- تعديل الأسبوع التلقائي ---
            const schoolStartDate = new Date('2025-08-22T00:00:00');
            function getCurrentSchoolWeek(startDate) {
                const today = new Date();
                const msSinceStart = today - startDate;
                const weeksSinceStart = msSinceStart / (1000 * 60 * 60 * 24 * 7);
                return Math.floor(weeksSinceStart);
            }

            // Global State
            let currentGrade = '1', currentSection = 'أ', currentRole = 'parent';
            let currentWeek = getCurrentSchoolWeek(schoolStartDate);
            
            let isTeacherAuthenticated = false;
            let unsubscribeAnnouncements = null;

            // DOM Elements
            const elements = {
                userRole: document.getElementById('userRole'),
                gradeSelect: document.getElementById('gradeSelect'),
                sectionSelect: document.getElementById('sectionSelect'),
                prevWeekBtn: document.getElementById('prevWeek'),
                nextWeekBtn: document.getElementById('nextWeek'),
                currentWeekDisplay: document.getElementById('currentWeek'),
                scheduleBody: document.getElementById('scheduleBody'),
                announcementsList: document.getElementById('announcementsList'),
                addAnnouncementBtn: document.getElementById('addAnnouncementBtn'),
                lessonModal: document.getElementById('lessonModal'),
                modalTitle: document.getElementById('modalTitle'),
                modalContent: document.getElementById('modalContent'),
                closeModalBtn: document.getElementById('closeModal'),
                loginModal: document.getElementById('teacherLoginModal'),
                confirmLoginBtn: document.getElementById('confirmLogin'),
                cancelLoginBtn: document.getElementById('cancelLogin'),
                passwordInput: document.getElementById('teacherPassword'),
                passwordError: document.getElementById('passwordError'),
                announcementModal: document.getElementById('announcementModal'),
                announcementModalTitle: document.getElementById('announcementModalTitle'),
                announcementTitleInput: document.getElementById('announcementTitle'),
                announcementContentInput: document.getElementById('announcementContent'),
                saveAnnouncementBtn: document.getElementById('saveAnnouncement'),
                cancelAnnouncementBtn: document.getElementById('cancelAnnouncement'),
                closeAnnouncementModalBtn: document.getElementById('closeAnnouncementModal'),
                toastContainer: document.getElementById('toastContainer')
            };

            // Toast Notification Manager
            class ToastManager {
                show(message, type = 'info', title = '') { const toast = document.createElement('div'); toast.className = `toast ${type}`; const icons = { success: '✅', error: '❌' }; const titles = { success: title || 'نجاح', error: title || 'خطأ' }; toast.innerHTML = `<div class="toast-icon">${icons[type]}</div><div><div class="font-bold">${titles[type]}</div><div class="text-sm">${message}</div></div>`; elements.toastContainer.appendChild(toast); setTimeout(() => toast.classList.add('show'), 100); setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, 4000); }
                success(message, title) { this.show(message, 'success', title); }
                error(message, title) { this.show(message, 'error', title); }
            }
            const toastManager = new ToastManager();

            // --- Core Functions ---
            async function renderSchedule() {
                elements.currentWeekDisplay.textContent = `الأسبوع ${currentWeek + 1}`;
                const docId = `${currentGrade}-${currentSection}-week${currentWeek}`;
                const docRef = db.collection('schedules').doc(docId);
                try {
                    const doc = await docRef.get();
                    const weekData = doc.exists ? doc.data() : { lessons: {} };
                    const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday'];
                    const dayNames = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
                    elements.scheduleBody.innerHTML = '';
                    days.forEach((day, i) => {
                        let rowHtml = `<tr class="border-b"><td class="p-3 font-bold bg-gray-50">${dayNames[i]}</td>`;
                        for (let j = 0; j < 7; j++) {
                            const period = j + 1;
                            const lesson = weekData.lessons?.[day]?.[period] || {};
                            const subject = lesson.subject || '';
                            const isComplete = lesson.completed && lesson.title;
                            let cellHtml = !subject && isTeacherAuthenticated ? `<div class="card cursor-pointer h-20 flex items-center justify-center p-3 border-2 border-dashed border-blue-400 bg-blue-50 rounded text-center" onclick="openModal('${day}',${period})">+ إضافة</div>` : !subject ? `<div class="p-3 bg-gray-100 rounded text-center text-gray-400 h-20 flex items-center justify-center">فارغ</div>` : `<div class="card cursor-pointer h-20 p-3 ${isComplete ? 'bg-main' : 'bg-gray-400'} text-white rounded text-center flex flex-col justify-center" onclick="openModal('${day}',${period},'${subject}')"><span>${subject}</span><small class="opacity-80">${lesson.title || 'بدون محتوى'}</small></div>`;
                            rowHtml += `<td class="p-1">${cellHtml}</td>`;
                        }
                        rowHtml += `</tr>`;
                        elements.scheduleBody.innerHTML += rowHtml;
                    });
                } catch (error) { toastManager.error('فشل في تحميل الجدول الدراسي.'); }
            }

            function listenForAnnouncements() {
                if (unsubscribeAnnouncements) unsubscribeAnnouncements();
                unsubscribeAnnouncements = db.collection('announcements').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                    elements.announcementsList.innerHTML = '';
                    if (snapshot.empty) { elements.announcementsList.innerHTML = '<div class="text-gray-500 text-center p-4">لا توجد إعلانات حاليًا</div>'; return; }
                    snapshot.forEach(doc => {
                        const announcement = { id: doc.id, ...doc.data() };
                        const date = announcement.createdAt?.toDate().toLocaleDateString('ar-SA') || '';
                        const el = document.createElement('div');
                        el.className = 'bg-blue-50 border-l-4 border-blue-400 p-4 mb-2';
                        let teacherButtons = isTeacherAuthenticated ? `<div class="mt-2 space-x-2 space-x-reverse"><button onclick="openAnnouncementModal(true, '${announcement.id}')" class="text-xs bg-yellow-500 text-white px-2 py-1 rounded">تعديل</button><button onclick="deleteAnnouncement('${announcement.id}')" class="text-xs bg-red-500 text-white px-2 py-1 rounded">حذف</button></div>` : '';
                        el.innerHTML = `<h4 class="font-bold">${announcement.title}</h4><p class="mt-1">${announcement.content}</p><small class="text-gray-500 mt-2 block">${date}</small>${teacherButtons}`;
                        elements.announcementsList.appendChild(el);
                    });
                }, error => { toastManager.error('فشل في تحميل الإعلانات.'); });
            }

            // *** دالة تسجيل الدخول القديمة كما هي ***
            function login() {
                if (elements.passwordInput.value === '13542') {
                    isTeacherAuthenticated = true;
                    currentRole = 'teacher';
                    elements.userRole.value = 'teacher';
                    elements.loginModal.classList.add('hidden');
                    elements.passwordInput.value = '';
                    elements.passwordError.classList.add('hidden');
                    updateUI();
                    toastManager.success('تم تسجيل الدخول بنجاح!');
                } else { elements.passwordError.classList.remove('hidden'); }
            }

            window.openModal = async (day, period, subject = '') => {
                const docId = `${currentGrade}-${currentSection}-week${currentWeek}`;
                const doc = await db.collection('schedules').doc(docId).get();
                const lesson = doc.exists ? (doc.data().lessons?.[day]?.[period] || {}) : {};
                elements.modalTitle.textContent = subject ? `${subject} - الحصة ${period}` : 'إضافة حصة جديدة';
                if (isTeacherAuthenticated) {
                    elements.modalContent.innerHTML = `<div class="space-y-4"><div><label class="block text-sm font-bold">اسم المادة*</label><input type="text" id="subjectName" class="w-full p-2 border rounded" value="${subject}" required></div><div><label class="block text-sm font-bold">عنوان الحصة*</label><input type="text" id="lessonTitle" class="w-full p-2 border rounded" value="${lesson.title || ''}" required></div><div><label class="block text-sm font-bold">محتوى الحصة</label><textarea id="lessonContent" rows="3" class="w-full p-2 border rounded">${lesson.content || ''}</textarea></div><div class="flex space-x-2 space-x-reverse"><button id="saveLessonBtn" class="flex-1 bg-green-500 text-white p-2 rounded">حفظ</button><button onclick="document.getElementById('lessonModal').classList.add('hidden')" class="flex-1 bg-gray-500 text-white p-2 rounded">إلغاء</button></div></div>`;
                    document.getElementById('saveLessonBtn').onclick = () => saveLesson(day, period);
                } else {
                    elements.modalContent.innerHTML = lesson.completed ? `<div class="space-y-3"><div><h4 class="font-bold">عنوان الحصة:</h4><p class="bg-gray-100 p-2 rounded">${lesson.title}</p></div><div><h4 class="font-bold">محتوى الحصة:</h4><p class="bg-gray-100 p-2 rounded">${lesson.content || 'لا يوجد'}</p></div></div>` : `<p class="text-center text-gray-500">لم يتم إضافة محتوى للحصة بعد.</p>`;
                }
                elements.lessonModal.classList.remove('hidden');
            };

            async function saveLesson(day, period) {
                const subject = document.getElementById('subjectName').value.trim();
                const title = document.getElementById('lessonTitle').value.trim();
                const content = document.getElementById('lessonContent').value.trim();
                if (!subject || !title) { toastManager.error('يرجى ملء حقلي المادة والعنوان.'); return; }
                const lessonData = { subject, title, content, completed: true };
                const docId = `${currentGrade}-${currentSection}-week${currentWeek}`;
                try {
                    await db.collection('schedules').doc(docId).set({ lessons: { [day]: { [period]: lessonData } } }, { merge: true });
                    elements.lessonModal.classList.add('hidden');
                    await renderSchedule();
                    toastManager.success('تم حفظ الحصة بنجاح!');
                } catch (error) { toastManager.error('فشل حفظ الحصة.'); }
            }

            window.openAnnouncementModal = async (isEditing = false, docId = null) => {
                if (isEditing && docId) {
                    const doc = await db.collection('announcements').doc(docId).get();
                    if (doc.exists) { const data = doc.data(); elements.announcementTitleInput.value = data.title; elements.announcementContentInput.value = data.content; elements.announcementModalTitle.textContent = 'تعديل إعلان'; elements.saveAnnouncementBtn.onclick = () => updateAnnouncement(docId); }
                } else { elements.announcementTitleInput.value = ''; elements.announcementContentInput.value = ''; elements.announcementModalTitle.textContent = 'إضافة إعلان جديد'; elements.saveAnnouncementBtn.onclick = saveNewAnnouncement; }
                elements.announcementModal.classList.remove('hidden');
            };

            async function saveNewAnnouncement() {
                const title = elements.announcementTitleInput.value.trim();
                const content = elements.announcementContentInput.value.trim();
                if (!title || !content) { toastManager.error('يرجى ملء جميع الحقول'); return; }
                try {
                    await db.collection('announcements').add({ title, content, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    elements.announcementModal.classList.add('hidden');
                    toastManager.success('تم نشر الإعلان بنجاح!');
                } catch { toastManager.error('فشل في حفظ الإعلان.'); }
            }
            
            async function updateAnnouncement(docId) {
                const title = elements.announcementTitleInput.value.trim();
                const content = elements.announcementContentInput.value.trim();
                if (!title || !content) { toastManager.error('يرجى ملء جميع الحقول'); return; }
                try {
                    await db.collection('announcements').doc(docId).update({ title, content });
                    elements.announcementModal.classList.add('hidden');
                    toastManager.success('تم تحديث الإعلان بنجاح!');
                } catch { toastManager.error('فشل في تحديث الإعلان.'); }
            }

            window.deleteAnnouncement = async (docId) => {
                if (confirm('هل أنت متأكد من حذف هذا الإعلان؟')) {
                    try {
                        await db.collection('announcements').doc(docId).delete();
                        toastManager.success('تم حذف الإعلان بنجاح.');
                    } catch { toastManager.error('فشل في حذف الإعلان.'); }
                }
            };

            function updateUI() {
                elements.addAnnouncementBtn.classList.toggle('hidden', !isTeacherAuthenticated);
                renderSchedule();
                listenForAnnouncements();
            }

            // --- Event Listeners Setup ---
            elements.userRole.addEventListener('change', (e) => {
                if (e.target.value === 'teacher' && !isTeacherAuthenticated) {
                    elements.loginModal.classList.remove('hidden');
                    e.target.value = 'parent';
                } else { currentRole = e.target.value; updateUI(); }
            });
            elements.gradeSelect.addEventListener('change', (e) => { currentGrade = e.target.value; renderSchedule(); });
            elements.sectionSelect.addEventListener('change', (e) => { currentSection = e.target.value; renderSchedule(); });
            elements.prevWeekBtn.addEventListener('click', () => { if (currentWeek > 0) { currentWeek--; renderSchedule(); } });
            elements.nextWeekBtn.addEventListener('click', () => { currentWeek++; renderSchedule(); });
            elements.closeModalBtn.addEventListener('click', () => elements.lessonModal.classList.add('hidden'));
            elements.confirmLoginBtn.addEventListener('click', login);
            elements.cancelLoginBtn.addEventListener('click', () => elements.loginModal.classList.add('hidden'));
            elements.passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });
            elements.addAnnouncementBtn.addEventListener('click', () => openAnnouncementModal(false));
            elements.closeAnnouncementModalBtn.addEventListener('click', () => elements.announcementModal.classList.add('hidden'));
            elements.cancelAnnouncementBtn.addEventListener('click', () => elements.announcementModal.classList.add('hidden'));
            
            // Initial load
            updateUI();
        });
    </script>
    ```
